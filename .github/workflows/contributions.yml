name: Atualizar calendário

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Gerar calendário
        uses: actions/github-script@v7
        with:
          script: |
            const update = require('./scripts/update-contributions.cjs');
            await update({github, core});

      - name: Salvar calendário
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Atualiza calendário de contribuições'
          git pull --rebase origin main
          git push origin HEAD:main
